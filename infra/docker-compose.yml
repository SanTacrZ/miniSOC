services:
  api:
    build: ../api
    container_name: minisoc-api
    ports:
      - "8000:8000"
    volumes:
      - ../logs:/app/logs
      - ../logs:/logs
      - ../infra:/app/infra
      - ../infra:/infra
      - ../infra/certs:/certs:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MTLS_ENABLED=false
    networks:
      - soc_net
    restart: unless-stopped

  siem:
    build:
      context: ../siem
      dockerfile: Dockerfile
    container_name: minisoc-siem
    ports:
      - "8001:8001"
    volumes:
      - ../logs:/app/logs
      - ../logs:/logs
      - ../alerts:/app/alerts
      - ../alerts:/alerts
      - ../siem:/app/siem
      - ../infra/certs:/certs:ro
      - ../infra:/infra:ro
    environment:
      - MTLS_ENABLED=false
    command: python -m engine.engine
    networks:
      - soc_net
    restart: unless-stopped

  forwarder:
    image: python:3.14-slim
    container_name: minisoc-forwarder
    volumes:
      - ../logs:/app/logs
      - ../logs:/logs
      - ../siem:/app/siem
      - ../infra:/infra:ro
    working_dir: /app
    command: python siem/forwarder/opensearch_forwarder.py
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_INDEX=minisoc-siem
    depends_on:
      - opensearch
    networks:
      - soc_net
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: minisoc-opensearch
    environment:
      - cluster.name=minisoc-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Minisoc123!
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - soc_net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: minisoc-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    networks:
      - soc_net

  wazuh:
    image: wazuh/wazuh-manager:4.9.0
    container_name: minisoc-wazuh
    ports:
      - "1514:1514"
      - "55000:55000"
    environment:
      - WAZUH_MANAGER_NAME=wazuh.manager
    volumes:
      - wazuh-data:/var/ossec/data
    networks:
      - soc_net
    profiles:
      - wazuh

  rustyapa:
    image: ubuntu:25.10
    container_name: minisoc-rustyapa
    volumes:
      - ../labs/rustyapa:/app
      - ../../Downloads/rustyapa_77887986df09ee05.tar.gz:/tmp/rustyapa.tar.gz:ro
    working_dir: /app
    command: bash -c "tar -xzf /tmp/rustyapa.tar.gz -C /tmp && /tmp/static/RUSTyapa"
    ports:
      - "11331:5000"
    privileged: true
    networks:
      - soc_net

volumes:
  opensearch-data:
  wazuh-data:

networks:
  soc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
